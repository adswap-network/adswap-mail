name: AdSwap Autonomous Outreach

on:
  schedule:
    # 5 esecuzioni al giorno distribuite (orari UTC)
    - cron: '15 8 * * *'   # 08:15 UTC (~10:15 CET)
    - cron: '45 11 * * *'  # 11:45 UTC (~13:45 CET)
    - cron: '20 14 * * *'  # 14:20 UTC (~16:20 CET)
    - cron: '50 16 * * *'  # 16:50 UTC (~18:50 CET)
    - cron: '10 19 * * *'  # 19:10 UTC (~21:10 CET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-play-scraper requests

      - name: Execute Autonomous Engine
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u outreach_engine.py

      - name: Commit Updated JSON State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outreach_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update outreach state [skip ci]" && git push)
