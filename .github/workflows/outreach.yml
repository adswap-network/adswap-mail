name: AdSwap Autonomous Outreach

on:
  schedule:
    - cron: '15 * * * *' # Esegue ogni singola ora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-play-scraper requests

      - name: Execute Outreach Engine
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u outreach_engine.py

      - name: Commit Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outreach_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update outreach state [skip ci]" && git push)
